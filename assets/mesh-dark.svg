<svg xmlns="http://www.w3.org/2000/svg" width="40" height="28" viewBox="0 0 40 28" role="img" aria-labelledby="t"><title id="t">A small network that reroutes around a failed link</title><style>@keyframes top{0%,4.983%{opacity:0;transform:translate(5px,14px)}5.000%{opacity:1;transform:translate(5px,14px)}18.333%{opacity:1;transform:translate(20px,4px)}31.667%{opacity:1;transform:translate(35px,14px)}31.683%,100%{opacity:0;transform:translate(35px,14px)}}@keyframes bottom{0%,48.317%{opacity:0;transform:translate(5px,14px)}48.333%{opacity:1;transform:translate(5px,14px)}61.667%{opacity:1;transform:translate(20px,24px)}75.000%{opacity:1;transform:translate(35px,14px)}75.017%,100%{opacity:0;transform:translate(35px,14px)}}@keyframes fail{0%,33.333%{stroke:#5F6B76;opacity:1}34.167%,43.333%{stroke:#D9534F;opacity:1}45.000%,80.000%{stroke:#D9534F;opacity:.25}86.667%,100%{stroke:#5F6B76;opacity:1}}.pt{animation:top 6.0s linear infinite}.pb{animation:bottom 6.0s linear infinite}.bd{animation:fail 6.0s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.pt,.pb{display:none}}</style><line class="" x1="5" y1="14" x2="20" y2="4" stroke="#5F6B76" stroke-width="1.6" stroke-linecap="round"/><line class="" x1="5" y1="14" x2="20" y2="24" stroke="#5F6B76" stroke-width="1.6" stroke-linecap="round"/><line class="" x1="20" y1="24" x2="35" y2="14" stroke="#5F6B76" stroke-width="1.6" stroke-linecap="round"/><line class="" x1="20" y1="4" x2="20" y2="24" stroke="#5F6B76" stroke-width="1.6" stroke-linecap="round"/><line class="bd" x1="20" y1="4" x2="35" y2="14" stroke="#5F6B76" stroke-width="1.6" stroke-linecap="round"/><circle cx="5" cy="14" r="3.2" fill="#56A4DC"/><circle cx="20" cy="4" r="3.2" fill="#56A4DC"/><circle cx="20" cy="24" r="3.2" fill="#56A4DC"/><circle cx="35" cy="14" r="3.2" fill="#56A4DC"/><circle class="pt" r="2.8" fill="#1BA48D" opacity="0"/><circle class="pb" r="2.8" fill="#1BA48D" opacity="0"/></svg>
